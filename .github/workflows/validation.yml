name: Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install ".[test]"
      - name: Test
        run: python -m pytest -q
      - name: Check public reproduction runner
        run: python scripts/reproduce.py smoke --out output/ci-reproduction-smoke --workers 2
      - name: Validate saved scientific evidence
        run: python scripts/validate_reproduction.py --out output/ci-saved-count-validation.json
      - name: Build distributions
        run: python -m build
      - name: Verify installed wheel outside the checkout
        shell: python
        run: |
          from contextlib import closing
          import pathlib
          import sqlite3
          import subprocess
          import sys
          import tempfile

          wheel = next(pathlib.Path('dist').glob('*.whl'))
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)], check=True)
          with tempfile.TemporaryDirectory() as directory:
              subprocess.run([
                  sys.executable, '-I', '-c',
                  'import pbm; from pbm.io.schema import get_schema_paths; paths = get_schema_paths(); assert paths.input_schema.is_file() and paths.output_schema.is_file(); print(pbm.__version__)',
              ], cwd=directory, check=True)
              for tool in ('pbm-build', 'pbm-simulate', 'pbm-postprocess'):
                  subprocess.run([tool, '--version'], cwd=directory, check=True)
              commands = [
                  ['pbm-build', '--nx', '2', '--ny', '2', '--nz', '2', '--db', 'input.db', '--truncate', 'yes'],
                  ['pbm-simulate', '--db', 'input.db', '--outdb', 'results.db', '--samples', '2000', '--threshold', '2', '--seed', '123', '--mc-workers', '2', '--mc-chunk-size', '1000'],
                  ['pbm-postprocess', '--outdb', 'results.db', '--figs-root', 'figs', '--make-plots', 'yes', '--plot-mode', 'standard'],
              ]
              for command in commands:
                  subprocess.run(command, cwd=directory, check=True)
              with closing(sqlite3.connect(pathlib.Path(directory) / 'results.db')) as connection:
                  assert connection.execute('SELECT sum(count) FROM pmf').fetchone()[0] == 2000
              assert list((pathlib.Path(directory) / 'figs').rglob('*.pdf'))
